[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nanomotif-rs"
version = "1.3.0"
description = "Compiled kernels for Nanomotif (pileup partitioning, motif-site bitsets, search-window filtering)"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/MicrobialDarkMatter/nanomotif"

[tool.maturin]
module-name = "nanomotif_rs"
